<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>任务结果 - 青柚 AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);padding:10px 22px;border-radius:9999px;font-size:14px;color:#fff;opacity:0;transition:.25s;z-index:99}
    .toast.ok{background:#10b981}.toast.err{background:#ef4444}.toast.show{opacity:1}
    nav a.active{background:#fdf2f8;color:#be185d}
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-pink-50 via-white to-amber-50">
  <div id="toast"></div>
  <nav class="max-w-4xl mx-auto flex items-center gap-1 px-4 py-4">
    <span class="font-bold text-xl text-pink-600 mr-4">青柚 AI</span>
    <a href="/index.html" class="px-3 py-1.5 rounded-lg text-sm text-gray-600">灵感工作台</a>
    <a href="/materials.html" class="px-3 py-1.5 rounded-lg text-sm text-gray-600">私有资料</a>
    <a href="/history.html" class="px-3 py-1.5 rounded-lg text-sm text-gray-600">历史任务</a>
    <a href="/profile.html" class="px-3 py-1.5 rounded-lg text-sm text-gray-600">用户中心</a>
    <a href="/config.html" class="px-3 py-1.5 rounded-lg text-sm text-gray-600">系统配置</a>
    <button id="backBtn" class="ml-auto px-3 py-1.5 rounded-lg text-sm bg-gray-100 hover:bg-gray-200">返回</button>
  </nav>

  <main class="max-w-4xl mx-auto px-4 pb-16">
    <div class="bg-amber-50 border border-amber-200 text-amber-700 rounded-xl px-4 py-3 text-sm mb-6 text-center font-medium">
      AI生成·仅供创作灵感，请人工修改后发布
    </div>

    <div id="loading" class="bg-white rounded-2xl p-6 shadow-sm text-center text-sm text-gray-500">任务执行中，请稍候…</div>
    <div id="result" class="hidden space-y-5"></div>
    <div id="failed" class="hidden bg-red-50 border border-red-200 text-red-600 rounded-xl p-4 text-sm"></div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
    function copy(t) { navigator.clipboard.writeText(t).then(() => toast("已复制"), () => toast("复制失败", "err")); }

    let _btnSeq = 0;
    const _btnHandlers = {};
    function block(title, html) {
      return `<div class="bg-white rounded-2xl p-5 shadow-sm"><h2 class="font-semibold text-gray-800 mb-2">${esc(title)}</h2><div class="text-sm text-gray-700 leading-6">${html}</div></div>`;
    }

    function btn(label, fn) {
      const key = "rbtn" + (++_btnSeq);
      _btnHandlers[key] = fn;
      return `<button id="${key}" class="px-4 py-1.5 rounded-lg text-xs font-medium bg-pink-500 text-white hover:bg-pink-600">${esc(label)}</button>`;
    }

    function wireButtons() {
      for (const key in _btnHandlers) {
        const el = document.getElementById(key);
        if (el) el.onclick = _btnHandlers[key];
      }
      _btnHandlers.__keys = Object.keys(_btnHandlers);
      for (const key of _btnHandlers.__keys) delete _btnHandlers[key];
    }

    const DEFAULT_SKILL = "screenshot_xhs_analyze";
    let sourceText = "";
    let renderBlocks = [];

    function getPath(r, path) {
      if (!path) return null;
      return path.split(".").reduce((o, k) => (o == null || o[k] === undefined ? null : o[k]), r);
    }
    function isNonEmptyStr(v) { return typeof v === "string" && v.trim() !== "" && !hasPlaceholder(v); }
    function isCleanList(v) { return Array.isArray(v) && v.length > 0 && v.every(it => isNonEmptyStr(it)); }
    function hasPlaceholder(text) {
      if (!text) return false;
      return /(Y{2,4}\s*[-–—/\\]\s*M{1,2}\s*[-–—/\\]\s*D{1,2})|(\d{4}\s*[-年/]\s*[Xx]+)|([Xx]{2,}\s*[年月日])|[Xx]{4,}|(\{\{\s*(date|日期|time|时间)\s*\}\})|([\[【]\s*(日期|时间|date|time)\s*[\]】])/i.test(text);
    }

    const blockMap = {
      ocr_text: {
        data(r) { return getPath(r, "ocr_text") || getPath(r, "image_text"); },
        valid(r) { return isNonEmptyStr(this.data(r)); },
        render(r) {
          const v = this.data(r);
          return block("截图解析文本（OCR/VLM）", `<p class="whitespace-pre-wrap">${esc(v)}</p><div class="flex gap-2 items-center mt-3">${btn("复制文本", () => copy(v))}</div>`);
        }
      },
      hot_analysis: {
        data(r) { return getPath(r, "hot_analysis") || getPath(r, "decompose"); },
        valid(r) {
          const d = this.data(r) || {};
          const ok = (Array.isArray(d.pain_points) && d.pain_points.length) || (Array.isArray(d.topic_angles) && d.topic_angles.length) || (d.framework && Object.keys(d.framework).length);
          return ok && !hasPlaceholder(JSON.stringify(d));
        },
        render(r) {
          const d = this.data(r) || {};
          const html = `
          <div class="flex gap-3 flex-wrap">
            <div class="flex-1 min-w-40 bg-red-50 rounded-xl p-3"><h4 class="text-xs font-medium text-red-600 mb-1">📌 痛点</h4><p class="whitespace-pre-wrap">${esc((d.pain_points||[]).join("\n"))}</p></div>
            <div class="flex-1 min-w-40 bg-blue-50 rounded-xl p-3"><h4 class="text-xs font-medium text-blue-600 mb-1">🎯 选题角度</h4><p class="whitespace-pre-wrap">${esc((d.topic_angles||[]).join("\n"))}</p></div>
            <div class="flex-1 min-w-40 bg-amber-50 rounded-xl p-3"><h4 class="text-xs font-medium text-amber-600 mb-1">🖋 写作框架</h4><p class="whitespace-pre-wrap">${esc(JSON.stringify(d.framework||{}, null, 2))}</p></div>
          </div>`;
          return block("爆款拆解", html);
        }
      },
      title_list: {
        data(r) { return getPath(r, "titles"); },
        valid(r) { return isCleanList(this.data(r)); },
        render(r) {
          const titles = this.data(r);
          const html = titles.map(tt => `<p class="mb-1.5">${esc(tt)}</p>`).join("");
          const btnsHtml = titles.map(tt => btn(`复制「${tt.slice(0,10)}…」`, () => copy(tt))).join("");
          return block("标题灵感（可多选）", `<div>${html}</div><div class="flex gap-2 flex-wrap mt-3">${btnsHtml}</div>`);
        }
      },
      note_paragraphs: {
        data(r) { return getPath(r, "note"); },
        valid(r) { return isNonEmptyStr(this.data(r)); },
        render(r) {
          const v = this.data(r);
          const barHtml = btn("复制正文", () => copy(v)) + btn("AI 改写", () => startRewrite(v));
          return block("笔记正文", `<p class="whitespace-pre-wrap break-words">${esc(v)}</p><div class="flex gap-2 flex-wrap items-center mt-3">${barHtml}</div>`);
        }
      },
      tags: {
        data(r) { return getPath(r, "tags"); },
        valid(r) { return isCleanList(this.data(r)); },
        render(r) {
          const tags = this.data(r);
          return block("话题标签", `<p class="whitespace-pre-wrap break-words">${esc(tags.join(" "))}</p><div class="flex gap-2 items-center mt-3">${btn("复制标签", () => copy(tags.join(" ")))}</div>`);
        }
      }
    };

    function render(t) {
      const box = document.getElementById("result");
      box.innerHTML = sections(t).join("");
      wireButtons();
      document.getElementById("loading").classList.add("hidden");
      document.getElementById("result").classList.remove("hidden");
    }

    function sections(t) {
      const r = t.result || {};
      const parts = [];
      sourceText = r.ocr_text || r.image_text || (r.rewrite && r.rewrite.text) || r.note || "";

      // 动态区块：仅渲染 skill ui_meta.render_blocks 中登记的区块，未登记的隐藏
      if (t.task_type !== "rewrite") {
        renderBlocks.forEach(b => {
          const impl = blockMap[b.block];
          if (!impl) return;
          const data = impl.data(r);
          const absent = data == null || (Array.isArray(data) ? data.length === 0 : (typeof data === "string" ? data.trim() === "" : false));
          if (absent) return; // 无数据区块直接隐藏（该 Skill 未产出此内容）
          if (!impl.valid(r)) {
            parts.push(block(b.title || b.block, `<div class="text-sm text-red-600 bg-red-50 border border-red-200 rounded-xl p-3">生成异常：AI 输出不符合要求，请重新生成</div>`));
            return;
          }
          parts.push(impl.render(r, b));
        });
      }

      if (r.draw_image && r.draw_image.image_url) {
        parts.push(block("AI 配图", `<img src="${esc(r.draw_image.image_url)}" class="max-h-72 rounded-xl border border-gray-100" onerror="this.style.display='none'" /><p class="mt-2 text-xs text-gray-400">图片为第三方临时链接，未保存在本站，可能因链接过期而无法显示。</p><div class="flex gap-2 items-center mt-3">${btn("复制图片地址", () => copy(r.draw_image.image_url))}</div>`));
      } else if (r.draw_image) {
        parts.push(block("AI 配图", `<p class="text-gray-400">未生成：未配置绘图服务或生成失败</p>`));
      }

      if (t.task_type === "rewrite" && r.rewrite) {
        const sim = Math.round((r.rewrite.similarity_score || 0) * 100);
        const warn = r.rewrite.reminder ? '<div class="mt-3 bg-red-50 border border-red-200 text-red-600 rounded-xl p-3 text-xs">' + esc(r.rewrite.reminder) + '</div>' : "";
        const barHtml = btn("复制改写文本", () => copy(r.rewrite.text));
        parts.push(block(`改写结果（相似度 ${sim}%）`, `<p class="whitespace-pre-wrap break-words">${esc(r.rewrite.text)}</p>${warn}<div class="flex gap-2 items-center mt-3">${barHtml}</div>`));
      }

      const op = `<div class="flex gap-3 flex-wrap">${btn("🔄 重新生成（扣点数）", () => retry(t.id))}${btn("🗑 删除任务", () => delTask(t.id))}</div>`;
      parts.push(op);
      return parts;
    }

    async function loadSkillMeta(task) {
      const skillId = task.skill_id || DEFAULT_SKILL;
      try {
        const cfg = await Api.get(`/skill/${skillId}`);
        renderBlocks = (cfg.ui_meta && cfg.ui_meta.render_blocks) || [];
      } catch (_) {
        renderBlocks = [];
      }
    }

    let taskId = new URLSearchParams(location.search).get("id");
    async function poll() {
      try {
        const t = await Api.get(`/tasks/${taskId}`);
        if (t.status === "pending" || t.status === "running") {
          document.getElementById("loading").textContent = "任务执行中，请稍候…";
          setTimeout(poll, 1500);
        } else if (t.status === "failed") {
          document.getElementById("loading").classList.add("hidden");
          const f = document.getElementById("failed"); f.classList.remove("hidden");
          f.textContent = `任务失败：${t.error || "未知错误"}`;
        } else {
          await loadSkillMeta(t);
          render(t);
        }
      } catch (err) {
        document.getElementById("loading").textContent = err.message;
      }
    }

    async function retry(id) {
      try { const d = await Api.post(`/tasks/${id}/retry`, {}); location.href = `/result.html?id=${d.task_id}`; }
      catch (err) { toast(err.message, "err"); }
    }
    async function delTask(id) {
      if (!confirm("确认删除该任务记录？")) return;
      try { await Api.del(`/tasks/${id}`); location.href = "/history.html"; }
      catch (err) { toast(err.message, "err"); }
    }
    async function startRewrite(source) {
      try {
        const d = await Api.post("/tasks", { task_type: "rewrite", text: source, use_materials: false, material_ids: [], draw_image: false });
        location.href = `/result.html?id=${d.task_id}`;
      } catch (err) { toast(err.message, "err"); }
    }

    Api.requireAuth();
    document.getElementById("backBtn").onclick = () => history.length ? history.back() : (location.href = "/history.html");
    poll();
  </script>
</body>
</html>
