<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>历史任务 - 青柚 AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);padding:10px 22px;border-radius:9999px;font-size:14px;color:#fff;opacity:0;transition:.25s;z-index:99}
    .toast.ok{background:#10b981}.toast.err{background:#ef4444}.toast.show{opacity:1}
    nav a.active{background:#fdf2f8;color:#be185d}
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-pink-50 via-white to-amber-50">
  <div id="toast"></div>
  <nav class="max-w-4xl mx-auto flex items-center gap-1 px-4 py-4">
    <span class="font-bold text-xl text-pink-600 mr-4">青柚 AI</span>
    <a href="/index.html" class="px-3 py-1.5 rounded-lg text-sm text-gray-600">灵感工作台</a>
    <a href="/materials.html" class="px-3 py-1.5 rounded-lg text-sm text-gray-600">私有资料</a>
    <a href="/history.html" class="active px-3 py-1.5 rounded-lg text-sm">历史任务</a>
    <a href="/profile.html" class="px-3 py-1.5 rounded-lg text-sm text-gray-600">用户中心</a>
    <a href="/config.html" class="px-3 py-1.5 rounded-lg text-sm text-gray-600">系统配置</a>
    <span class="ml-auto text-sm text-gray-400" id="countBadge"></span>
  </nav>

  <main class="max-w-4xl mx-auto px-4 pb-16">
    <p class="text-xs text-amber-600 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 mb-4">【上传图片仅用于本次AI解析，系统不会保存您的截图，历史记录仅保留文字结果】</p>
    <div id="list" class="space-y-3"></div>
    <p id="empty" class="hidden text-center text-sm text-gray-400 py-10">暂无任务，去首页创作第一条吧</p>
  </main>

  <script src="/js/api.js"></script>
  <script>
    function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
    async function load() {
      const data = await Api.get("/tasks?page=1&size=50");
      document.getElementById("countBadge").textContent = `共 ${data.total} 条`;
      const box = document.getElementById("list");
      box.innerHTML = "";
      if (!data.items.length) { document.getElementById("empty").classList.remove("hidden"); return; }
      document.getElementById("empty").classList.add("hidden");
      data.items.forEach((it) => {
        const typeName = it.task_type === "rewrite" ? "笔记改写" : "灵感生成";
        const statusText = {pending:"排队中",running:"执行中",success:"已完成",failed:"失败"}[it.status] || it.status;
        const statusColor = it.status === "success" ? "text-green-600 bg-green-50" : it.status === "failed" ? "text-red-600 bg-red-50" : "text-amber-600 bg-amber-50";
        const card = document.createElement("div");
        card.className = "bg-white rounded-2xl p-5 shadow-sm";
        card.innerHTML = `
          <div class="flex items-center gap-3 flex-wrap">
            <span class="text-xs font-medium px-2 py-1 rounded-lg ${statusColor}">${statusText}</span>
            <h3 class="font-medium text-gray-800">${typeName} #${it.id}</h3>
            <span class="text-xs text-gray-400">-${it.points_cost} 点 · ${esc(String(it.created_at).slice(0,19).replace("T"," "))}</span>
            <span class="ml-auto flex gap-2">
              <a href="/result.html?id=${it.id}" class="px-3 py-1.5 rounded-lg text-xs bg-pink-500 text-white hover:bg-pink-600">查看</a>
              <button data-act="retry" data-id="${it.id}" class="px-3 py-1.5 rounded-lg text-xs bg-gray-100 hover:bg-gray-200">重新生成</button>
              <button data-act="del" data-id="${it.id}" class="px-3 py-1.5 rounded-lg text-xs bg-red-50 text-red-500 hover:bg-red-100">删除</button>
            </span>
          </div>
          ${it.summary && (it.summary.note || it.summary.titles) ? `<p class="mt-3 text-sm text-gray-600 line-clamp-2">${esc(it.summary.note || (it.summary.titles||[]).join("、"))}</p>` : ""}`;
        card.querySelector('[data-act="retry"]').onclick = async (e) => {
          try { const d = await Api.post(`/tasks/${e.currentTarget.dataset.id}/retry`, {}); location.href = `/result.html?id=${d.task_id}`; }
          catch (err) { toast(err.message, "err"); }
        };
        card.querySelector('[data-act="del"]').onclick = async (e) => {
          if (!confirm("确认删除该任务记录？")) return;
          try { await Api.del(`/tasks/${e.currentTarget.dataset.id}`); load(); toast("已删除"); }
          catch (err) { toast(err.message, "err"); }
        };
        box.appendChild(card);
      });
    }
    if (!Api.requireAuth()) {}
    load();
  </script>
</body>
</html>
